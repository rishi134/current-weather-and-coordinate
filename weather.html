<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web by RISHI RAJ</title>
    <link rel="stylesheet" href="weather.css">
    <script src="weather.js"></script>
   
</head>

<body >
    
    
     <div id="interface" >

        <div style="height: 250px;">
            <h1 id="headings" style="color: red; font-style: italic; margin: 10px; text-align: center; text-transform:uppercase; margin: 10px; padding: 10%;" >
                <strong> CURRENT WEATHER AND COORDINATES </strong>
            </h1>
        </div> 
      
        <div id="seacrhsection">
            <div class="weatherimage1"> </div>
            <div class="search wrap">
                  <input type="text" id="city" placeholder="Enter City Name">
                     <button class="searchButton" onclick="runclick()">
                         Search
                     </button>
            </div>

               <div class="weatherimage2"></div>

        </div>

        <div id="nameofcity" style="font-weight: bold;">
            <b style="font-size: 20px;"> City</b>
        </div>

        <div id="output">
                
            <div id="weathers">
                <b>Weather:-</b>
                <br>
                    <div id="temp"></div>
                    <div id="description"></div>
            </div>
            <div id="coordinate">
                <b>Coordinates:-</b>
                <br>
                     <div id="longitude"></div>
                     <div id="latitude"></div>
            </div>
        </div>
     </div>   
</body>
</html>
